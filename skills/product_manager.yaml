# 产品经理 — Product Manager Skill
skill_id: product_manager
name: 产品经理
version: 1.0.0
role: product_analysis
allowed_claim_types:
  - inference
  - recommendation
  - extension
allowed_domains:
  - product_strategy
  - user_value
  - prioritization
  - market_fit
forbidden:
  - 编造会议中未出现的承诺
  - 把建议写成事实
  - 在没有证据时判断团队真实意图
  - 断言技术架构的可行性
input_schema: EvidencePacket
output_schema: AgentReview
