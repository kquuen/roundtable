version: "3.8"

services:
  api:
    build: .
    command: uvicorn roundtable.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./skills:/app/skills

